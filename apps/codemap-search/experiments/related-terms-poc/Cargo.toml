[package]
name = "related-terms-poc"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "rtpoc"
path = "src/main.rs"

[dependencies]
# Product library: index engine, config, and identifier splitting. The product crate is not edited.
codemap-search = { path = "../.." }
# Versions match apps/codemap-search/Cargo.lock so the experiment reads the same index format
# and links the same bundled SQLite as the product.
tantivy = "=0.26.2"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"

[profile.release]
opt-level = 3
